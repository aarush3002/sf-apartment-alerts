# SF high-rise apartment monitor configuration.
# Every building points at the property's OWN availability feed (never Zillow/Redfin/etc).
#
# Source types:
#   securecafe  Yardi RentCafe online-leasing page (live Voyager availability + per-unit apply link)
#   sightmap    Engrain SightMap JSON behind the interactive floor-plan map on the property site
#   jdfp        RentCafe-built property site floor-plan app JSON (unit list w/ pricing + unit pages)
#   greystar    greystar.com property page (Next.js payload)
#   equity      equityapartments.com property page (embedded unit JSON + Elise apply links)
#   related     relatedrentals.com property page (unit cards)
#   avalon      avaloncommunities.com community page (embedded unit JSON)
#   udr         udr.com apartments-pricing page (embedded view-model JSON + RealPage apply links)
#   nema        rentnema.com/availabilities (NEMA's own page incl. per-unit apply links)
#   rentcafe_site  RentCafe-hosted marketing site /floorplans page(s) + floor-plan detail pages (unit rows)
#   elise       EliseAI application portal (eqr-applications.com): live units Equity accepts applications for
#   entrata     Entrata ProspectPortal floor-plans page (embedded `var unitsData` JSON)
#
# `fallback` is tried when the primary source errors. `apply_enrich` looks a NEW unit up on the
# building's securecafe page to attach the unit-specific application link.

filters:
  bedrooms: [0, 1, 2]   # 0 = studio
  # max_price: 9000        # monthly rent cap (uncomment to use)
  # min_sqft: 900
  # available_by: 2026-12-31
  include_unknown_bedrooms: false

notify:
  to: ["+1XXXXXXXXXX"]        # your phone number(s); one text per recipient
  channels:
    - imessage            # sends from this Mac's Messages.app (iMessage, or SMS relay via your iPhone)
    # - type: twilio      # needs TWILIO_ACCOUNT_SID / TWILIO_AUTH_TOKEN / TWILIO_FROM in .env
    # - type: ntfy        # push notification; set NTFY_TOPIC in .env and subscribe in the ntfy app
    #   topic: your-secret-topic
    # - console

poll:
  interval: 120             # seconds between polls of an unprotected source
  securecafe_interval: 180  # securecafe.com sits behind Cloudflare; poll it more gently
  jitter: 0.15
  concurrency: 6
  per_host: 2
  relist_days: 21           # a unit that vanished and comes back after this many days counts as new again

